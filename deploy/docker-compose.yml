# Production stack on the Timeweb VPS. Lives in /opt/tubestat, copied there by CI on every deploy.
# Secrets come from /opt/tubestat/.env (never committed).
name: tubestat

# Docker keeps container logs forever by default; 3 × 20 MB per container is enough to read an incident.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

# Memory on the 8 GB VPS (ADR 0019): postgres 2 GB, worker 1.5 GB, web 1 GB, redis 384 MB, caddy 128 MB;
# the rest (~3 GB) stays with the OS page cache. Node heaps are capped below their container limit.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      # Caddyfile.basepath when the app lives under BASE_PATH (deploy/apply-env.sh picks it), plain Caddyfile at the root.
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    image: ${APP_IMAGE:?APP_IMAGE is set by the deploy script}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tubestat:${POSTGRES_PASSWORD}@postgres:5432/tubestat
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --max-old-space-size=768
    logging: *logging
    mem_limit: 1g
    volumes:
      - raw_data:/data/raw
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000${BASE_PATH:-}/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Ingest and nightly jobs. Enable with COMPOSE_PROFILES=worker in .env.
  worker:
    image: ${APP_IMAGE:?APP_IMAGE is set by the deploy script}
    profiles: [worker]
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tubestat:${POSTGRES_PASSWORD}@postgres:5432/tubestat
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --max-old-space-size=1152
    logging: *logging
    mem_limit: 1536m
    volumes:
      - raw_data:/data/raw
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sized for a 2 GB container on an 8 GB host: own cache 512 MB, planner assumes ~2 GB of OS cache.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB", "-c", "work_mem=16MB",
              "-c", "maintenance_work_mem=128MB", "-c", "max_connections=60", "-c", "wal_buffers=16MB"]
    shm_size: 256m
    logging: *logging
    mem_limit: 2g
    environment:
      POSTGRES_DB: tubestat
      POSTGRES_USER: tubestat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubestat -d tubestat"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction; maxmemory turns a runaway queue into a clear error instead of eating the host.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    logging: *logging
    mem_limit: 384m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  raw_data:
