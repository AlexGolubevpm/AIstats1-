# Production stack on the Timeweb VPS. Lives in /opt/tubestat, copied there by CI on every deploy.
# Secrets come from /opt/tubestat/.env (never committed).
name: tubestat

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    image: ${APP_IMAGE:?APP_IMAGE is set by the deploy script}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tubestat:${POSTGRES_PASSWORD}@postgres:5432/tubestat
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Enabled once the BullMQ worker exists: add COMPOSE_PROFILES=worker to .env.
  worker:
    image: ${APP_IMAGE:?APP_IMAGE is set by the deploy script}
    profiles: [worker]
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tubestat:${POSTGRES_PASSWORD}@postgres:5432/tubestat
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tubestat
      POSTGRES_USER: tubestat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubestat -d tubestat"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
