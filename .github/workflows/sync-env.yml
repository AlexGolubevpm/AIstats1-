name: Sync server .env

# Copies the AdSpyglass / Metrika credentials from the `production` environment secrets into
# /opt/tubestat/.env on the server (scripts/sync-env.sh), generates APP_PASSWORD once if it is
# missing, enables the worker and restarts the stack. Values travel over SSH stdin only and are
# never printed; the log shows key names and "updated / unchanged". Run manually or by changing
# .github/sync-env.request on a pushed branch.
on:
  workflow_dispatch:
  push:
    paths: [".github/sync-env.request"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY" | bash scripts/ci/normalize-ssh-key.sh > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/known_hosts

      - name: Sync and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          ASG_AUTH_EMAIL: ${{ secrets.ASG_AUTH_EMAIL }}
          ASG_AUTH_TOKEN: ${{ secrets.ASG_AUTH_TOKEN }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: |
          for k in ASG_AUTH_EMAIL ASG_AUTH_TOKEN METRIKA_TOKEN; do
            [ -n "${!k}" ] && echo "$k: provided" || echo "$k: no secret in the production environment, skipped"
          done
          dir=/tmp/sync-env-$GITHUB_RUN_ID
          ssh deploy@"$HOST" "mkdir -p $dir"
          scp -q scripts/sync-env.sh deploy@"$HOST":$dir/
          for k in ASG_AUTH_EMAIL ASG_AUTH_TOKEN METRIKA_TOKEN; do
            [ -n "${!k}" ] && printf '%s %s\n' "$k" "$(printf '%s' "${!k}" | base64 -w0)"
          done | ssh deploy@"$HOST" "bash $dir/sync-env.sh; rc=\$?; rm -rf $dir; exit \$rc"
