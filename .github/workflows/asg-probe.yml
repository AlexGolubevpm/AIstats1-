name: ASG API probe

# Manually triggered: discovers which groupings/filters the AdSpyglass (ADOK) report
# API supports. The repository is public, so the log shows structure only
# (status codes, row counts, field names, masked name shapes) — never values.
on:
  # Also runs when .github/asg-probe.request changes on a pushed branch: lets automation
  # without workflow_dispatch permission request a probe. File format: KEY=value lines
  # (DATE=YYYY-MM-DD, WEBSITE_ID=123, WHERE=server|github, SKIP_PARTNER=1, MODE=filters|multi), all optional.
  # ADOK blocks frequent requests, so a run probes from ONE place: the production server
  # by default (that is where the ingest will run), GitHub runners only on request.
  push:
    paths: [".github/asg-probe.request"]
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (default: yesterday UTC)"
        required: false
      website_id:
        description: "AdSpyglass website id to scope per-site probes (optional)"
        required: false
      where:
        description: "Where to probe from: server (default) or github"
        required: false
        default: server

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        env:
          ASG_AUTH_EMAIL: ${{ secrets.ASG_AUTH_EMAIL }}
          ASG_AUTH_TOKEN: ${{ secrets.ASG_AUTH_TOKEN }}
          ASG_PROBE_REDACT: "1"
          ASG_PROBE_OUT: ${{ runner.temp }}/asg-samples
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SITE: ${{ inputs.website_id }}
          INPUT_WHERE: ${{ inputs.where }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/asg-probe.request ]; then
            req_date=$(sed -n 's/^DATE=\([0-9-]*\)$/\1/p' .github/asg-probe.request | head -n1)
            req_site=$(sed -n 's/^WEBSITE_ID=\([0-9]*\)$/\1/p' .github/asg-probe.request | head -n1)
            req_where=$(sed -n 's/^WHERE=\(server\|github\)$/\1/p' .github/asg-probe.request | head -n1)
            req_skip=$(sed -n 's/^SKIP_PARTNER=\([01]\)$/\1/p' .github/asg-probe.request | head -n1)
            req_mode=$(sed -n 's/^MODE=\(filters\|multi\)$/\1/p' .github/asg-probe.request | head -n1)
            INPUT_DATE="${req_date:-$INPUT_DATE}"
            INPUT_SITE="${req_site:-$INPUT_SITE}"
            INPUT_WHERE="${req_where:-$INPUT_WHERE}"
            export ASG_PROBE_SKIP_PARTNER="${req_skip:-0}"
            export ASG_PROBE_MODE="${req_mode:-}"
          fi
          if [ "${INPUT_WHERE:-server}" != "github" ]; then
            echo "Probing from the server only (WHERE=${INPUT_WHERE:-server}); skipping the GitHub runner."
            exit 0
          fi
          if [ -z "$ASG_AUTH_EMAIL" ] || [ -z "$ASG_AUTH_TOKEN" ]; then
            echo "::error::Add ASG_AUTH_EMAIL and ASG_AUTH_TOKEN to the production environment secrets."
            exit 1
          fi
          date="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          bash scripts/asg-probe.sh "$date" "$INPUT_SITE"

  # Same probe, but executed on the production server over SSH: tells an IP allowlist on
  # the ADOK side (works from the server, fails from GitHub runners) from bad credentials.
  probe-from-server:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY" | bash scripts/ci/normalize-ssh-key.sh > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/known_hosts

      - name: Probe from server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          ASG_AUTH_EMAIL: ${{ secrets.ASG_AUTH_EMAIL }}
          ASG_AUTH_TOKEN: ${{ secrets.ASG_AUTH_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SITE: ${{ inputs.website_id }}
          INPUT_WHERE: ${{ inputs.where }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/asg-probe.request ]; then
            req_date=$(sed -n 's/^DATE=\([0-9-]*\)$/\1/p' .github/asg-probe.request | head -n1)
            req_site=$(sed -n 's/^WEBSITE_ID=\([0-9]*\)$/\1/p' .github/asg-probe.request | head -n1)
            req_where=$(sed -n 's/^WHERE=\(server\|github\)$/\1/p' .github/asg-probe.request | head -n1)
            req_skip=$(sed -n 's/^SKIP_PARTNER=\([01]\)$/\1/p' .github/asg-probe.request | head -n1)
            req_mode=$(sed -n 's/^MODE=\(filters\|multi\)$/\1/p' .github/asg-probe.request | head -n1)
            INPUT_DATE="${req_date:-$INPUT_DATE}"
            INPUT_SITE="${req_site:-$INPUT_SITE}"
            INPUT_WHERE="${req_where:-$INPUT_WHERE}"
            export ASG_PROBE_SKIP_PARTNER="${req_skip:-0}"
            export ASG_PROBE_MODE="${req_mode:-}"
          fi
          if [ "${INPUT_WHERE:-server}" = "github" ]; then
            echo "Probing from the GitHub runner only (WHERE=github); skipping the server."
            exit 0
          fi
          date="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          dir=/tmp/asg-probe-$GITHUB_RUN_ID
          ssh deploy@"$HOST" "mkdir -p $dir/scripts/ci"
          scp -q scripts/asg-probe.sh deploy@"$HOST":$dir/scripts/
          scp -q scripts/ci/shape.sh deploy@"$HOST":$dir/scripts/ci/
          # Credentials go over stdin, never on a command line (ps) or in the log.
          { printf 'ASG_AUTH_EMAIL=%q\n' "$ASG_AUTH_EMAIL"; printf 'ASG_AUTH_TOKEN=%q\n' "$ASG_AUTH_TOKEN"; } |
            ssh deploy@"$HOST" "set -a; . /dev/stdin; set +a; \
              ASG_PROBE_REDACT=1 ASG_PROBE_SKIP_PARTNER=${ASG_PROBE_SKIP_PARTNER:-0} ASG_PROBE_MODE=${ASG_PROBE_MODE:-} ASG_PROBE_OUT=$dir/out bash $dir/scripts/asg-probe.sh $date $INPUT_SITE; rc=\$?; rm -rf $dir; exit \$rc"
